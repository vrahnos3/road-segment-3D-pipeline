<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local 3D Splat Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 24px; }
    </style>

    <script type="importmap">
    {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="loading">Loading .splat... Please wait (this may take a minute for large files).</div>

    <script type="module">
        import * as THREE from 'three';
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            'cameraUp': [0, 1, 0],
            'initialCameraPosition': [0.37080, -0.16839, 0.82091],
            'initialCameraLookAt': [0.01745, -0.26517, -0.06434]
        });

        // export_splat.py updates current.splat to point at the latest dataset export.
        viewer.addSplatScene('splat_files/splat_cropped.splat', {
            'splatAlphaCrop': 0.1,
            'rotation': [-0.707, 0, 0, 0.707],
            'splatAlphaRemovalThreshold': 10
        })
        .then(() => {
            document.getElementById('loading').style.display = 'none';
            viewer.start();
        })
        .catch((e) => {
            document.getElementById('loading').innerText = "Error loading file! Check console.";
            console.error("Error loading the .splat file.", e);
        });
    </script>
</body>
</html>
